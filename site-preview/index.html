<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f9f7f2">
  <title>綜合領域｜研習點餐</title>
  <style>
    :root{--ink:#26312c;--muted:#727a72;--green:#315b48;--mint:#e8f0e7;--cream:#f9f7f2;--line:#e6e2d9;--orange:#db7848;--white:#fff}
    *{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif}
    .top{display:flex;align-items:center;justify-content:space-between;gap:24px;max-width:1080px;margin:auto;padding:24px 28px}.brand{font-size:15px;font-weight:800;letter-spacing:.1em;color:var(--green)}
    .qrbox{display:flex;align-items:center;gap:11px;padding:9px 12px;border:1px solid var(--line);background:#fff;border-radius:16px;font-size:12px;color:var(--muted)}.qr{width:66px;height:66px;display:block;object-fit:contain;border-radius:8px}
    main{max-width:1080px;margin:12px auto 64px;padding:0 28px}.hero{display:grid;grid-template-columns:1.2fr .8fr;gap:30px;align-items:center;padding:34px 0 42px}.eyebrow{color:var(--orange);font-size:12px;font-weight:800;letter-spacing:.16em}.hero h1{font-size:clamp(34px,5vw,58px);line-height:1.15;letter-spacing:-.04em;margin:12px 0}.hero p{color:var(--muted);line-height:1.8;margin:0}.date-pill{display:inline-block;margin-top:20px;padding:9px 14px;background:var(--mint);border-radius:99px;color:var(--green);font-weight:700;font-size:14px}.hero-art{position:relative;height:250px;border-radius:30px;background:linear-gradient(145deg,#f2dfbd,#e8cba5);overflow:hidden;display:grid;place-items:center}.hero-art:before,.hero-art:after{content:"";position:absolute;border-radius:50%;background:#fff8;filter:blur(1px)}.hero-art:before{width:230px;height:230px;right:-34px;top:-70px}.hero-art:after{width:175px;height:175px;left:-45px;bottom:-85px}.hero-art span{font-size:115px;filter:drop-shadow(0 12px 8px #6b452544);z-index:1}
    .layout{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(260px,.6fr);gap:24px}.panel{background:var(--white);border:1px solid var(--line);border-radius:24px;padding:24px}.section-head{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:17px}.section-head h2{font-size:21px;margin:0}.section-head small,.hint{color:var(--muted);font-size:13px}.field{margin:0 0 25px}.field label{display:block;font-size:14px;font-weight:750;margin-bottom:9px}.name-row{display:flex;gap:9px}.name-row select,.name-row input{width:100%;padding:13px;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--ink);font:inherit}.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.food{position:relative;display:block;cursor:pointer}.food input{position:absolute;opacity:0}.food .inner{height:100%;border:1px solid var(--line);border-radius:17px;overflow:hidden;transition:.15s;background:#fff}.food input:checked+.inner{border:2px solid var(--green);box-shadow:0 0 0 3px #315b4818}.food img{display:block;width:100%;height:148px;object-fit:contain;background:#fff}.food .caption{padding:11px 13px 13px;display:flex;justify-content:space-between;align-items:center;font-weight:700}.check{font-size:11px;color:var(--green);opacity:0}.food input:checked+.inner .check{opacity:1}.drinks{display:flex;gap:11px}.drink{position:relative;flex:1;display:flex;align-items:center;gap:12px;border:1px solid var(--line);padding:10px 12px;border-radius:14px;cursor:pointer;overflow:hidden;transition:.15s}.drink:has(input:checked){border:2px solid var(--green);background:#f6faf5}.drink input{accent-color:var(--green);width:18px;height:18px;flex:0 0 auto}.drink img{width:72px;height:72px;object-fit:contain;border-radius:9px;background:#fff}.drink .drink-name{font-weight:700}.drink .drink-check{margin-left:auto;font-size:11px;color:var(--green);opacity:0}.drink:has(input:checked) .drink-check{opacity:1}.submit{width:100%;border:0;background:var(--green);color:#fff;padding:15px;border-radius:14px;font:inherit;font-weight:800;cursor:pointer}.submit:disabled{opacity:.5;cursor:not-allowed}.notice{min-height:22px;margin:9px 0 0;text-align:center;font-size:13px;color:var(--green)}
    .summary{position:sticky;top:18px;height:max-content}.summary h2{margin:0 0 4px;font-size:20px}.summary .hint{margin:0 0 20px}.count{font-size:40px;font-weight:800;color:var(--green);line-height:1}.count small{font-size:14px;font-weight:600;color:var(--muted)}.bar{margin:10px 0 14px}.bar-title{display:flex;justify-content:space-between;font-size:13px;margin-bottom:6px}.track{height:8px;background:#eff0ec;border-radius:10px;overflow:hidden}.fill{height:100%;background:#7fa38c;border-radius:10px;transition:width .3s}.orders{margin-top:18px;border-top:1px solid var(--line);padding-top:15px}.orders h3{font-size:13px;margin:0 0 10px}.order{font-size:13px;color:var(--muted);padding:7px 0;border-bottom:1px solid #f1efea}.order b{color:var(--ink);font-weight:650}.privacy{font-size:12px;line-height:1.7;color:var(--muted);margin-top:18px;padding:12px;background:#f7f6f2;border-radius:12px}.toast{position:fixed;inset:auto 18px 18px auto;max-width:320px;background:#26312c;color:#fff;padding:13px 16px;border-radius:12px;box-shadow:0 10px 30px #0002;opacity:0;transform:translateY(8px);transition:.2s;pointer-events:none}.toast.show{opacity:1;transform:none}
    footer{max-width:1080px;margin:0 auto 32px;padding:0 28px;text-align:right;font-size:12px}footer a{color:var(--muted)}
    @media(max-width:760px){.top{padding:18px 16px}.qrbox span{display:none}main{padding:0 16px;margin-top:3px}.hero{grid-template-columns:1fr;gap:20px;padding:25px 0 30px}.hero-art{height:170px}.hero-art span{font-size:85px}.layout{grid-template-columns:1fr}.summary{position:static;order:2}.panel{padding:18px}.food img{height:120px}footer{padding:0 16px}}
  </style>
</head>
<body>
  <header class="top"><div class="brand">WORKSHOP LUNCH · 研習午餐</div><div class="qrbox"><img id="qrcode" class="qr" alt="本網站 QR Code"><span>掃描 QR Code<br>快速開啟點餐頁</span></div></header>
  <main>
    <section class="hero"><div><div class="eyebrow">LEARN · SHARE · LUNCH</div><h1>綜合領域<br>研習點餐</h1><p>今天一起學習，也一起好好吃頓午餐。選好主餐和飲料，送出後就能保存你的點餐卡。</p><div class="date-pill">◷　民國 115 年 10 月 2 日（五）</div></div><div class="hero-art" aria-hidden="true"><span>🍔</span></div></section>
    <div class="layout"><section class="panel"><div class="section-head"><h2>填寫你的餐點</h2><small>每人主餐、飲料各選一</small></div>
      <form id="order-form"><div class="field"><label for="custom-name">姓名</label><div class="name-row"><input id="custom-name" type="text" maxlength="30" placeholder="請輸入姓名" aria-label="姓名" required></div><p class="hint">請輸入姓名。</p></div>
      <div class="field"><div class="section-head"><label style="margin:0">主餐</label><small>擇一</small></div><div class="cards" id="mains"></div></div>
      <div class="field"><div class="section-head"><label style="margin:0">飲料</label><small>擇一</small></div><div class="drinks"><label class="drink"><input type="radio" name="drink" value="可樂" required><img src="assets/cola.png" alt="冰可樂" loading="lazy"><span class="drink-name">可樂</span><span class="drink-check">✓ 已選</span></label><label class="drink"><input type="radio" name="drink" value="無糖綠茶" required><img src="assets/green-tea.png" alt="無糖綠茶" loading="lazy"><span class="drink-name">無糖綠茶</span><span class="drink-check">✓ 已選</span></label></div></div>
      <button class="submit" type="submit">確認送出　→</button><p id="notice" class="notice" aria-live="polite"></p></form></section>
      <aside class="panel summary"><h2>即時統計</h2><p class="hint">目前收到的餐點數量</p><div class="count"><span id="total">—</span> <small>份訂單</small></div><div id="stats"></div><div class="privacy">公開頁面只顯示各品項統計，不公開姓名或個別訂單。</div></aside>
    </div>
  </main><footer><a href="admin.html">管理者入口</a></footer><div class="toast" id="toast" role="status"></div>
  <script>
    const mains=[['大麥克','assets/big-mac.png'],['勁辣雞腿堡','assets/spicy-chicken.png'],['麥克雞塊','assets/nuggets.png'],['麥香魚','assets/filet-o-fish.png']];
    const isPreview=location.protocol==='file:'; const key='workshop-lunch-orders-v1'; let previewOrders=[];
    if(isPreview){try{previewOrders=JSON.parse(localStorage.getItem(key)||'[]')}catch{previewOrders=[]}}
    const $=s=>document.querySelector(s);
    $('#mains').innerHTML=mains.map(([n,img])=>`<label class="food"><input type="radio" name="main" value="${n}" required><span class="inner"><img src="${img}" alt="${n}" loading="lazy"><span class="caption">${n}<span class="check">✓ 已選</span></span></span></label>`).join('');
    function renderStats(data){const total=data.total||0;$('#total').textContent=total;const values={...data.mains,...data.drinks};const all=[...mains.map(x=>x[0]),'可樂','無糖綠茶'];$('#stats').innerHTML=all.map(n=>{const c=values[n]||0;const pct=total?Math.round(c/total*100):0;return `<div class="bar"><div class="bar-title"><span>${n}</span><b>${c}</b></div><div class="track"><div class="fill" style="width:${pct}%"></div></div></div>`}).join('')}
    async function refreshStats(){if(isPreview){const total=previewOrders.length;const mainsCount={},drinksCount={};for(const o of previewOrders){mainsCount[o.main]=(mainsCount[o.main]||0)+1;drinksCount[o.drink]=(drinksCount[o.drink]||0)+1}renderStats({total,mains:mainsCount,drinks:drinksCount});return}try{const response=await fetch('/api/stats',{cache:'no-store'});if(!response.ok)throw new Error();renderStats(await response.json())}catch{$('#total').textContent='—';$('#stats').innerHTML='<p class="hint">統計暫時無法載入，請稍後重試。</p>'}}
    $('#qrcode').src=`https://api.qrserver.com/v1/create-qr-code/?size=160x160&data=${encodeURIComponent(location.href)}`;
    function toast(t){const el=$('#toast');el.textContent=t;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),2600)}
    function downloadCard(o){const c=document.createElement('canvas');c.width=900;c.height=540;const x=c.getContext('2d');x.fillStyle='#f9f7f2';x.fillRect(0,0,c.width,c.height);x.fillStyle='#315b48';x.font='700 28px system-ui';x.fillText('WORKSHOP LUNCH · 研習午餐',55,72);x.fillStyle='#26312c';x.font='800 48px system-ui';x.fillText('綜合領域｜點餐卡',55,155);x.font='600 25px system-ui';x.fillText('民國 115 年 10 月 2 日',55,210);x.strokeStyle='#e6e2d9';x.beginPath();x.moveTo(55,250);x.lineTo(845,250);x.stroke();x.fillStyle='#727a72';x.font='600 21px system-ui';x.fillText('姓名',55,310);x.fillText('主餐',55,375);x.fillText('飲料',55,440);x.fillStyle='#26312c';x.font='700 26px system-ui';x.fillText(o.name,190,310);x.fillText(o.main,190,375);x.fillText(o.drink,190,440);x.fillStyle='#315b48';x.font='700 18px system-ui';x.fillText('謝謝，祝你有美好的一餐！',55,505);const a=document.createElement('a');a.download='綜合領域-研習點餐卡.png';a.href=c.toDataURL('image/png');a.click()}
    $('#order-form').addEventListener('submit',async e=>{e.preventDefault();const name=$('#custom-name').value.trim();const main=$('input[name="main"]:checked')?.value;const drink=$('input[name="drink"]:checked')?.value;if(!name){$('#notice').textContent='請選擇學員姓名，或輸入現場報名姓名。';return}if(!main||!drink){$('#notice').textContent='請選擇一份主餐和一種飲料。';return}const o={name,main,drink,createdAt:new Date().toISOString()};$('#notice').textContent='正在送出…';try{if(isPreview){previewOrders.push(o);localStorage.setItem(key,JSON.stringify(previewOrders))}else{const response=await fetch('/api/orders',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(o)});const result=await response.json();if(!response.ok)throw new Error(result.error||'送出失敗')}downloadCard(o);e.target.reset();$('#notice').textContent='訂單已送出，點餐卡 PNG 已下載。';toast('送出成功！你的 PNG 點餐卡已準備好。');await refreshStats()}catch(error){$('#notice').textContent=error.message||'目前無法送出，請稍後再試。'}});
    refreshStats();
  </script>
</body>
</html>

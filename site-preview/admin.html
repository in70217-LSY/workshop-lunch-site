<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>管理端｜綜合領域研習點餐</title>
  <style>
    :root{--ink:#26312c;--muted:#727a72;--green:#315b48;--cream:#f9f7f2;--line:#e6e2d9;--white:#fff}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif}.wrap{max-width:1050px;margin:48px auto;padding:0 22px}.panel{background:#fff;border:1px solid var(--line);border-radius:20px;padding:24px;margin-bottom:18px}h1{font-size:26px;margin:0 0 7px}.muted{color:var(--muted);font-size:14px}.login{display:flex;gap:10px;margin-top:18px}.login input{flex:1;min-width:0;padding:12px;border:1px solid var(--line);border-radius:10px;font:inherit}.button{border:0;border-radius:10px;background:var(--green);color:#fff;padding:12px 16px;font:inherit;font-weight:700;cursor:pointer}.button.secondary{background:#edf1ec;color:var(--green)}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px}.count{font-size:32px;font-weight:800;color:var(--green)}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:600px}th,td{text-align:left;padding:12px 10px;border-bottom:1px solid var(--line);font-size:14px}th{color:var(--muted);font-weight:650}.error{min-height:22px;color:#aa4834;font-size:14px;margin-top:10px}.hidden{display:none}.note{font-size:12px;color:var(--muted);line-height:1.7;margin-top:14px}
    @media(max-width:600px){.wrap{margin:22px auto}.panel{padding:18px}.login{flex-direction:column}.toolbar{align-items:flex-start;flex-direction:column}}
  </style>
</head>
<body>
  <main class="wrap">
    <section class="panel" id="login-panel"><h1>管理者登入</h1><div class="muted">登入後可查看完整訂單與統計。管理密鑰只在此瀏覽器工作階段暫存。</div><form class="login" id="login-form"><input id="token" type="password" autocomplete="current-password" placeholder="輸入 Cloudflare 設定的管理密鑰" required><button class="button">登入</button></form><div class="error" id="login-error" aria-live="polite"></div><p class="note">管理密鑰由網站管理者自行設定於 Cloudflare Pages 的 ADMIN_TOKEN Secret。請勿把密鑰放進 GitHub 程式碼或分享給點餐者。</p></section>
    <section class="panel hidden" id="admin-panel"><div class="toolbar"><div><h1>綜合領域｜訂單管理</h1><div class="muted">民國 115 年 10 月 2 日</div></div><button class="button secondary" id="logout">登出</button></div><p class="count" id="count">0 份</p><div class="table-wrap"><table><thead><tr><th>姓名</th><th>主餐</th><th>飲料</th><th>送出時間</th></tr></thead><tbody id="rows"></tbody></table></div><div class="error" id="admin-error" aria-live="polite"></div></section>
  </main>
  <script>
    const $=s=>document.querySelector(s);const sessionKey='lunch-admin-token';
    function cell(row,value){const td=document.createElement('td');td.textContent=value;row.append(td)}
    async function load(token){const r=await fetch('/api/admin/orders',{headers:{Authorization:`Bearer ${token}`},cache:'no-store'});const data=await r.json();if(!r.ok)throw new Error(data.error||'登入失敗');$('#rows').replaceChildren();$('#count').textContent=`${data.orders.length} 份`;for(const order of data.orders){const tr=document.createElement('tr');cell(tr,order.name);cell(tr,order.main);cell(tr,order.drink);cell(tr,new Date(order.created_at).toLocaleString('zh-TW'));$('#rows').append(tr)}$('#login-panel').classList.add('hidden');$('#admin-panel').classList.remove('hidden')}
    $('#login-form').addEventListener('submit',async e=>{e.preventDefault();const token=$('#token').value;$('#login-error').textContent='';try{await load(token);sessionStorage.setItem(sessionKey,token);$('#token').value=''}catch(error){$('#login-error').textContent=error.message}});
    $('#logout').addEventListener('click',()=>{sessionStorage.removeItem(sessionKey);$('#admin-panel').classList.add('hidden');$('#login-panel').classList.remove('hidden')});
    const saved=sessionStorage.getItem(sessionKey);if(saved)load(saved).catch(()=>{sessionStorage.removeItem(sessionKey);$('#login-error').textContent='登入狀態已失效，請重新登入。'});
  </script>
</body>
</html>
